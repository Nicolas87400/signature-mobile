<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature client OPTI SÉCURITÉ</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:18px;color:#15324b;text-align:center}
.card{max-width:620px;margin:0 auto;background:#fff;border:1px solid #d8e2ef;border-radius:18px;box-shadow:0 16px 40px rgba(15,35,55,.08);padding:20px}
h1{font-size:22px;margin:0 0 8px}p{color:#62748a}canvas{width:100%;height:260px;border:2px dashed #9fb3ca;border-radius:14px;background:#fff;touch-action:none;display:block}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}button{padding:13px 18px;border-radius:12px;border:1px solid #d8e2ef;background:#fff;font-size:16px;font-weight:700;cursor:pointer}button.primary{background:#1d63ea;color:#fff;border-color:#1d63ea}button.danger{background:#fff5f5;color:#991b1b;border-color:#fecaca}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eef4ff;border:1px solid #b9ccef;font-weight:700}.ok{background:#ecfdf5;border-color:#86efac;color:#166534}.err{background:#fff5f5;border-color:#fecaca;color:#991b1b}.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>✍ Signature client</h1>
<p>Signez avec le doigt puis cliquez sur <b>Valider la signature</b>.</p>
<canvas id="sign" width="700" height="260"></canvas>
<div class="actions">
<button class="danger" onclick="clearPad()">Effacer</button>
<button class="primary" onclick="sendSignature()">Valider la signature</button>
</div>
<div id="status" class="status">En attente de signature…</div>
</div>
<script>
const SUPABASE_URL = 'https://sxayrobdeyrtshiuqnpi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YXlyb2JkZXlydHNoaXVxbnBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjAzODgsImV4cCI6MjA5MzczNjM4OH0.ryAnYsk0_b9BopffvX9sAAgvILgjStDeyIqhT9DIcZY';
const params = new URLSearchParams(location.search);
const sessionId = params.get('id');
const canvas=document.getElementById('sign');
const ctx=canvas.getContext('2d');
ctx.lineWidth=3; ctx.lineCap='round'; ctx.strokeStyle='#111827';
let drawing=false;
function status(msg, cls=''){const el=document.getElementById('status'); el.className='status '+cls; el.textContent=msg;}
if(!sessionId) status('Session signature absente. Scannez le QR code du PV.', 'err');
function pos(e){const rect=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height)};}
function start(e){drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();}
function move(e){if(!drawing)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault();}
function stop(){drawing=false;}
canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',stop);
canvas.addEventListener('touchstart',start); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',stop);
function clearPad(){ctx.clearRect(0,0,canvas.width,canvas.height); status('Signature effacée. Signez à nouveau.');}
function isEmpty(){const empty=document.createElement('canvas'); empty.width=canvas.width; empty.height=canvas.height; return canvas.toDataURL()===empty.toDataURL();}
async function sendSignature(){
 if(!sessionId) return status('Session absente. Re-scanner le QR code.', 'err');
 if(isEmpty()) return status('Veuillez signer avant de valider.', 'err');
 status('Envoi de la signature…');
 const data=canvas.toDataURL('image/png');
 try{
  const res=await fetch(SUPABASE_URL+'/rest/v1/opti_signatures?session_id=eq.'+encodeURIComponent(sessionId),{
    method:'PATCH',
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({signature_data:data, signed_at:new Date().toISOString()})
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  status('✅ Signature envoyée. Vous pouvez rendre le téléphone au technicien.', 'ok');
 }catch(e){console.error(e); status('Erreur envoi signature. Vérifiez la connexion Internet.', 'err');}
}
</script>
</body>
</html>
